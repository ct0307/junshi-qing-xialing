<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>青绿行军 · 军师请下令界面提案</title>
  <link rel="stylesheet" href="preview.css">
  <style>
    @font-face {
      font-family: "JadeChinese";
      src: url("assets/chinese.otf") format("opentype");
      font-display: swap;
    }

    :root {
      --ink: #183e37;
      --jade: #3a7861;
      --leaf: #8ba779;
      --silk: #f4f0dd;
      --copper: #b28b52;
      --mist: #e0ebde;
      --font-body: "JadeChinese", "Microsoft YaHei", sans-serif;
      --font-display: "STSong", "SimSun", "JadeChinese", serif;
      --font-number: "Consolas", "SFMono-Regular", monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--ink);
      font-family: var(--font-body);
      background: var(--mist);
      background-image: radial-gradient(ellipse at 50% 30%, rgba(244,240,221,.8), transparent 75%);
    }
    button { font: inherit; cursor: pointer; color: inherit; }
    button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 4px;
    }
    button:disabled { cursor: default; }
    .viewport { position: fixed; inset: 0; overflow: hidden; }
    #artboard {
      position: absolute;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      transform-origin: top left;
      background: var(--silk);
      isolation: isolate;
      box-shadow: 0 24px 70px rgba(24,62,55,.19);
    }
    .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; flex: none; }
    .svg-definitions { position: absolute; width: 0; height: 0; overflow: hidden; }

    /* 铜线与浅绢只构成界面边界，地图保持正式素材的明亮色彩。 */
    .command-bar {
      position: absolute;
      inset: 0 0 auto;
      height: 80px;
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 25px;
      padding: 13px 24px;
      background: var(--silk);
      border-bottom: 1px solid rgba(178,139,82,.55);
    }
    .command-bar::after {
      content: "";
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: -5px;
      border-bottom: 1px solid rgba(178,139,82,.3);
    }
    .mission {
      display: flex;
      align-items: center;
      width: 299px;
      gap: 13px;
      flex: none;
    }
    .command-seal {
      position: relative;
      width: 46px;
      height: 49px;
      display: grid;
      place-items: center;
      color: var(--silk);
      background: var(--jade);
      border: 1px solid var(--ink);
      font: 29px/1 var(--font-display);
      box-shadow: inset 0 0 0 3px var(--jade), inset 0 0 0 4px rgba(244,240,221,.5);
      clip-path: polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
    }
    .mission-copy { min-width: 0; }
    .game-name { margin: 0 0 1px; font-size: 10px; letter-spacing: 3px; color: var(--jade); }
    .mission-title { display: flex; align-items: center; gap: 15px; }
    h1 { margin: 0; font: 27px/1.25 var(--font-display); letter-spacing: 2px; font-weight: 600; white-space: nowrap; }
    .phase-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 23px;
      padding: 0 7px;
      border: 1px solid rgba(58,120,97,.35);
      color: var(--jade);
      font-size: 12px;
      white-space: nowrap;
    }
    .phase-badge::before { content: ""; width: 4px; height: 4px; background: currentColor; transform: rotate(45deg); }
    .battle-readouts { display: flex; align-items: center; justify-content: center; gap: 27px; flex: 1; height: 50px; }
    .stat { position: relative; min-width: 72px; }
    .stat + .stat::before { content: ""; position: absolute; left: -15px; top: 10px; height: 30px; border-left: 1px solid rgba(58,120,97,.17); }
    .stat-label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: rgba(24,62,55,.72); white-space: nowrap; }
    .stat-label .icon { width: 12px; height: 12px; }
    .stat-value { display: block; margin-top: 3px; font: 23px/1.1 var(--font-number); letter-spacing: -.6px; white-space: nowrap; }
    .gate-value { color: var(--jade); }
    .stat-value small { font: 12px var(--font-body); letter-spacing: 0; opacity: .7; }
    .gold-stat { min-width: 74px; }
    .gold-stat .stat-label .icon { color: var(--copper); }
    .gold-value { font-weight: bold; }
    .time-stat { min-width: 65px; }
    .time-stat .stat-value { font-size: 18px; margin-top: 7px; }
    .battle-controls { display: flex; align-items: center; gap: 9px; flex: none; }
    .square-button, .speed-button {
      display: grid;
      place-items: center;
      height: 42px;
      background: transparent;
      border: 1px solid rgba(58,120,97,.3);
      border-radius: 2px;
    }
    .square-button { width: 35px; border-color: transparent; }
    .square-button .icon { width: 20px; height: 20px; }
    .speed-button { width: 73px; font: bold 14px var(--font-number); }
    .square-button:hover, .speed-button:hover { background: rgba(58,120,97,.08); border-color: var(--jade); }
    .primary-order {
      position: relative;
      width: 161px;
      height: 49px;
      padding: 0 14px;
      color: var(--silk);
      background: var(--jade);
      border: 1px solid var(--ink);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 2px;
      box-shadow: 0 3px 0 rgba(24,62,55,.14), inset 0 0 0 3px var(--jade), inset 0 0 0 4px rgba(244,240,221,.24);
    }
    .primary-order::before { content: "▸"; margin-right: 7px; font-size: 17px; }
    .primary-order:hover { background: var(--ink); box-shadow: 0 3px 0 rgba(24,62,55,.14), inset 0 0 0 3px var(--ink), inset 0 0 0 4px rgba(244,240,221,.3); }
    body[data-phase="running"] .primary-order::before { content: "Ⅱ"; font: 13px var(--font-number); }
    body[data-phase="paused"] .phase-badge { color: var(--ink); background: rgba(178,139,82,.13); border-color: var(--copper); }
    body[data-wallet="low"] .gold-stat .stat-label::after { content: "· 紧缺"; color: var(--ink); }

    .battle-map {
      position: absolute;
      left: 16px;
      top: 88px;
      width: 1248px;
      height: 472px;
      overflow: hidden;
      border: 1px solid rgba(178,139,82,.62);
      background: var(--mist);
    }
    .battle-map::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 12;
      box-shadow: inset 0 0 0 3px rgba(244,240,221,.48), inset 0 0 24px rgba(24,62,55,.055);
    }
    .battle-map .scene-map { width: 100%; height: 100%; object-fit: fill; }
    .battle-map .scene-slot {
      color: var(--jade);
      border: 1px solid rgba(58,120,97,.36);
      background: rgba(139,167,121,.12);
      box-shadow: inset 0 0 0 1px rgba(244,240,221,.12);
      transition: background .16s, border-color .16s, box-shadow .16s;
    }
    .battle-map .scene-slot.is-candidate,
    .battle-map .scene-slot:hover, .battle-map .scene-slot:focus-visible {
      border: 2px solid var(--jade);
      background: rgba(244,240,221,.72);
      box-shadow: 0 0 0 3px rgba(244,240,221,.22), inset 0 0 0 2px rgba(139,167,121,.3);
    }
    .battle-map .scene-unit { filter: drop-shadow(0 4px 2px rgba(24,62,55,.16)); }
    .battle-map .scene-label {
      padding: 3px 7px;
      border: 1px solid rgba(58,120,97,.32);
      border-radius: 2px;
      color: var(--ink);
      background: rgba(244,240,221,.95);
      font: 13px/1.2 var(--font-body);
      box-shadow: 0 1px 3px rgba(24,62,55,.14);
    }
    .battle-map .scene-label span { font-size: 12px; color: var(--jade); }
    .battle-map .scene-coverage { border-color: rgba(58,120,97,.65); background: rgba(139,167,121,.12); }
    .battle-caption {
      position: absolute;
      top: 100px;
      left: 28px;
      z-index: 17;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 29px;
      padding: 0 10px;
      border-left: 3px solid var(--jade);
      background: rgba(244,240,221,.93);
      color: var(--ink);
      font-size: 11px;
      box-shadow: 0 2px 8px rgba(24,62,55,.08);
    }
    .battle-caption .icon { width: 13px; height: 13px; }
    .battle-caption .caption-divider { width: 1px; height: 10px; background: rgba(178,139,82,.6); }
    .placement-note {
      position: absolute;
      z-index: 23;
      top: 562px;
      left: 145px;
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 22px;
      max-width: 737px;
      padding: 0 6px;
      border: 0;
      background: var(--silk);
      font-size: 12px;
      line-height: 1.45;
    }
    .placement-note > .icon { width: 14px; height: 14px; color: var(--jade); }
    .cancel-choice { margin-left: 3px; padding: 1px 1px 1px 10px; border: 0; border-left: 1px solid rgba(178,139,82,.5); background: none; font-size: 12px; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; }
    .cancel-choice:hover { color: var(--jade); }

    .bottom-silk {
      position: absolute;
      inset: 553px 0 0;
      z-index: 19;
      border-top: 1px solid rgba(178,139,82,.65);
      background-color: var(--silk);
      background-image: repeating-linear-gradient(0deg, transparent 0, transparent 3px, rgba(178,139,82,.024) 3px, rgba(178,139,82,.024) 4px);
      box-shadow: 0 -4px 16px rgba(24,62,55,.055);
    }
    .bottom-silk::before {
      content: "";
      position: absolute;
      left: 24px;
      right: 24px;
      top: 4px;
      border-top: 1px solid rgba(178,139,82,.24);
    }
    .roster-heading {
      position: absolute;
      z-index: 21;
      left: 26px;
      top: 565px;
      display: flex;
      align-items: center;
      width: 924px;
      gap: 13px;
      height: 18px;
    }
    .roster-heading h2 { margin: 0; font: 16px/1 var(--font-display); letter-spacing: 2px; }
    .roster-heading p { margin: 0; font-size: 10px; color: rgba(24,62,55,.65); }
    .roster-heading::after { content: ""; flex: 1; border-top: 1px solid rgba(178,139,82,.3); }
    .page-button { order: 1; border: 0; background: transparent; padding: 3px 0 3px 8px; color: var(--jade); font-size: 12px; white-space: nowrap; }
    .page-button span { margin-left: 4px; font-family: var(--font-number); }
    .hero-list {
      position: absolute;
      left: 24px;
      top: 590px;
      z-index: 21;
      display: grid;
      grid-template-columns: repeat(5,1fr);
      gap: 8px;
      width: 926px;
      height: 99px;
    }
    .hero-card {
      position: relative;
      min-width: 0;
      height: 99px;
      padding: 0;
      text-align: left;
      color: var(--ink);
      border: 1px solid rgba(58,120,97,.3);
      border-radius: 2px;
      background: var(--mist);
      background-image: linear-gradient(105deg, rgba(244,240,221,.08), rgba(244,240,221,.83));
      box-shadow: 0 3px 0 rgba(24,62,55,.045), inset 0 0 0 3px rgba(244,240,221,.55);
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .hero-card::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; border-left: 1px solid rgba(178,139,82,.65); z-index: 2; }
    .hero-card:hover { border-color: var(--jade); box-shadow: 0 3px 0 rgba(24,62,55,.08), inset 0 0 0 3px rgba(244,240,221,.55); }
    .hero-portrait {
      position: absolute;
      left: 9px;
      bottom: 1px;
      width: 67px;
      height: 90px;
      object-fit: contain;
      object-position: bottom;
      filter: drop-shadow(1px 1px 0 rgba(24,62,55,.1));
    }
    .hero-name { position: absolute; top: 24px; left: 82px; margin: 0; font: 22px/1.15 var(--font-display); letter-spacing: 2px; font-weight: 600; }
    .hero-role { position: absolute; top: 52px; left: 82px; font-size: 12px; color: rgba(24,62,55,.74); letter-spacing: .3px; }
    .hero-price { position: absolute; left: 82px; bottom: 10px; display: inline-flex; align-items: center; gap: 4px; font: bold 16px/1 var(--font-number); }
    .hero-price .icon { width: 12px; height: 12px; color: var(--copper); }
    .hero-state { position: absolute; top: 3px; right: 4px; height: 19px; padding: 0 5px; background: rgba(58,120,97,.09); color: var(--jade); border: 1px solid rgba(58,120,97,.16); font-size: 12px; line-height: 17px; white-space: nowrap; }
    .hero-card.is-selected { border: 2px solid var(--jade); background-color: var(--silk); box-shadow: 0 0 0 2px rgba(139,167,121,.2), 0 4px 0 rgba(24,62,55,.08); }
    .hero-card.is-selected .hero-portrait { left: 8px; bottom: 0; }
    .hero-card.is-selected .hero-name, .hero-card.is-selected .hero-role, .hero-card.is-selected .hero-price { left: 81px; }
    .hero-card.is-selected::after { content: ""; position: absolute; left: calc(50% - 5px); top: -7px; width: 10px; height: 10px; background: var(--jade); transform: rotate(45deg); }
    .hero-card.is-deployed .hero-state { color: var(--silk); background: var(--jade); border-color: var(--jade); }
    .hero-card.is-unaffordable .hero-portrait { opacity: .72; filter: grayscale(.6); }
    .hero-card.is-unaffordable .hero-state { background: rgba(178,139,82,.16); color: var(--ink); border-color: rgba(178,139,82,.5); }
    .hero-card.is-unaffordable .hero-price { text-decoration: underline dotted var(--copper); text-underline-offset: 3px; }

    .growth-card {
      position: absolute;
      z-index: 22;
      left: 970px;
      top: 561px;
      width: 286px;
      height: 137px;
      background: var(--mist);
      border: 1px solid rgba(58,120,97,.37);
      border-top: 3px solid var(--jade);
      box-shadow: inset 0 0 0 4px rgba(244,240,221,.7), 0 3px 0 rgba(24,62,55,.04);
    }
    .growth-portrait { position: absolute; left: 12px; top: 6px; width: 47px; height: 52px; object-fit: contain; object-position: bottom; }
    .growth-name { position: absolute; left: 70px; top: 8px; margin: 0; max-width: 198px; font: 22px/1.25 var(--font-display); font-weight: 600; letter-spacing: 2px; white-space: nowrap; }
    .growth-role { position: absolute; left: 71px; top: 39px; font-size: 12px; color: rgba(24,62,55,.75); }
    .growth-tag { position: absolute; right: 11px; top: 11px; font-size: 9px; letter-spacing: 1px; color: var(--jade); writing-mode: vertical-rl; line-height: 1.3; }
    .growth-button {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 65px;
      height: 31px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: rgba(244,240,221,.92);
      border: 1px solid rgba(58,120,97,.5);
      color: var(--ink);
      font-size: 12px;
    }
    .growth-button .icon { width: 14px; height: 14px; color: var(--jade); }
    .growth-button:hover { background: var(--jade); color: var(--silk); }
    .growth-button:hover .icon { color: var(--silk); }
    .growth-note { position: absolute; left: 13px; right: 12px; top: 99px; margin: 0; color: rgba(24,62,55,.78); font-size: 12px; line-height: 1.35; }
    .proposal-footer { position: absolute; z-index: 24; left: 25px; right: 25px; bottom: 7px; display: flex; align-items: center; gap: 8px; color: rgba(24,62,55,.58); font-size: 9px; letter-spacing: .5px; }
    .proposal-footer::before { content: ""; width: 13px; border-top: 1px solid var(--copper); }
    .proposal-footer .footer-name { margin-left: auto; color: var(--jade); font-size: 9px; letter-spacing: 2px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <svg class="svg-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9h6v6H9z"/></symbol>
    <symbol id="i-gate" viewBox="0 0 24 24"><path d="M3 21V8h18v13M1 8h22M5 8V4h14v4M9 21v-7a3 3 0 0 1 6 0v7M3 12h3m12 0h3M8 4V1m8 3V1"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 22V3m0 0c5-5 9 5 15 0v11c-6 5-10-5-15 0"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="i-rules" viewBox="0 0 24 24"><path d="M5 4h14v17H5zM8 4V2m8 2V2M8 9h8M8 13h8M8 17h5"/></symbol>
    <symbol id="i-cursor" viewBox="0 0 24 24"><path d="m5 3 13 9-6 1-3 6zM12 13l4 7"/></symbol>
    <symbol id="i-growth" viewBox="0 0 24 24"><path d="M4 20h16M7 16V11m5 5V7m5 9V3M4 9l7-6"/></symbol>
  </svg>

  <div class="viewport">
    <main id="artboard" aria-label="军师请下令，青绿行军界面提案">
      <header class="command-bar">
        <div class="mission">
          <div class="command-seal" aria-hidden="true">令</div>
          <div class="mission-copy">
            <p class="game-name">军师请下令</p>
            <div class="mission-title">
              <h1>黄巾演武</h1>
              <span class="phase-badge" data-readout="state">备战</span>
            </div>
          </div>
        </div>
        <div class="battle-readouts" aria-label="战场状态">
          <div class="stat">
            <span class="stat-label"><svg class="icon" aria-hidden="true"><use href="#i-flag"/></svg>敌军波次</span>
            <span class="stat-value" data-readout="wave">0 / 8</span>
          </div>
          <div class="stat">
            <span class="stat-label"><svg class="icon" aria-hidden="true"><use href="#i-gate"/></svg>城门耐久</span>
            <span class="stat-value gate-value">30<small> / 30</small></span>
          </div>
          <div class="stat gold-stat">
            <span class="stat-label"><svg class="icon" aria-hidden="true"><use href="#i-coin"/></svg>军饷</span>
            <span class="stat-value gold-value" data-readout="gold">240</span>
          </div>
          <div class="stat time-stat">
            <span class="stat-label"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>守关计时</span>
            <span class="stat-value" data-readout="time">00:00</span>
          </div>
        </div>
        <div class="battle-controls">
          <button class="square-button" data-action="rules" aria-label="查看守关规则" title="守关规则"><svg class="icon" aria-hidden="true"><use href="#i-rules"/></svg></button>
          <button class="speed-button" data-action="speed" aria-label="切换战斗速度">1×</button>
          <button class="primary-order" data-action="toggle-run">开始守关</button>
        </div>
      </header>

      <section class="battle-map" data-scene aria-label="黄巾关战场，点击空阵位上阵"></section>
      <div class="placement-note" role="status" aria-live="polite">
        <svg class="icon" aria-hidden="true"><use href="#i-cursor"/></svg>
        <span data-readout="hint">已选择赵云，点击空阵位上阵。</span>
        <button class="cancel-choice" data-action="deselect">取消选择</button>
      </div>

      <div class="bottom-silk" aria-hidden="true"></div>
      <div class="roster-heading">
        <h2 id="roster-title">随军武将</h2>
        <button class="page-button" data-action="page">五卡展示<span>›</span></button>
      </div>
      <section class="hero-list" aria-labelledby="roster-title">
        <button class="hero-card is-deployed" data-hero="guan_yu">
          <img class="hero-portrait" src="assets/portraits/guan_yu.png" alt="" draggable="false">
          <span class="hero-name">关羽</span><span class="hero-role">定点破阵</span>
          <span class="hero-price"><svg class="icon" aria-hidden="true"><use href="#i-coin"/></svg>130</span>
          <span class="hero-state" data-card-status>已上阵</span>
        </button>
        <button class="hero-card is-deployed" data-hero="huang_zhong">
          <img class="hero-portrait" src="assets/portraits/huang_zhong.png" alt="" draggable="false">
          <span class="hero-name">黄忠</span><span class="hero-role">定点破阵</span>
          <span class="hero-price"><svg class="icon" aria-hidden="true"><use href="#i-coin"/></svg>110</span>
          <span class="hero-state" data-card-status>已上阵</span>
        </button>
        <button class="hero-card is-selected" data-hero="zhao_yun">
          <img class="hero-portrait" src="assets/portraits/zhao_yun.png" alt="" draggable="false">
          <span class="hero-name">赵云</span><span class="hero-role">群体清场</span>
          <span class="hero-price"><svg class="icon" aria-hidden="true"><use href="#i-coin"/></svg>120</span>
          <span class="hero-state" data-card-status>可招募</span>
        </button>
        <button class="hero-card" data-hero="zhou_yu">
          <img class="hero-portrait" src="assets/portraits/zhou_yu.png" alt="" draggable="false">
          <span class="hero-name">周瑜</span><span class="hero-role">群体清场</span>
          <span class="hero-price"><svg class="icon" aria-hidden="true"><use href="#i-coin"/></svg>135</span>
          <span class="hero-state" data-card-status>可招募</span>
        </button>
        <button class="hero-card" data-hero="lu_xun">
          <img class="hero-portrait" src="assets/portraits/lu_xun.png" alt="" draggable="false">
