<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>军师请下令 · B 漆金军令</title>
  <link rel="stylesheet" href="preview.css">
  <style>
    @font-face{font-family:MilitarySong;src:url('assets/chinese.otf') format('opentype');font-display:swap}
    :root{--lacquer:#211c18;--lacquer-raised:#302821;--bronze:#756654;--vermilion:#8d352d;--gold:#c7ab70;--ivory:#eee4d0;--quiet:#b9ac97;--jade:#637b68}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background:#141310;color:var(--ivory);font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px}
    button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
    button:focus-visible{outline:3px solid #f0d690;outline-offset:4px;z-index:30}
    button:disabled{cursor:not-allowed}
    button{ -webkit-tap-highlight-color:transparent}
    svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
    #artboard{position:absolute;width:1280px;height:720px;overflow:hidden;background:var(--lacquer);isolation:isolate;box-shadow:0 30px 110px #0008;transform-origin:top left}
    #artboard::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:linear-gradient(125deg,#fff2 0,transparent 25%,transparent 80%,#0002 100%);opacity:.15}
    .display{font-family:MilitarySong,"Noto Serif CJK SC","Songti SC",SimSun,serif;font-weight:400}
    .utility{font-family:Consolas,"Microsoft YaHei",monospace;font-variant-numeric:tabular-nums}
    .roster{position:absolute;inset:0 auto 0 0;width:200px;padding:23px 12px 0;background:linear-gradient(90deg,#1a1714,#29221c 85%,#201b17);border-right:1px solid #75665488;z-index:8}
    .roster::after{content:"";position:absolute;top:19px;bottom:19px;right:4px;width:1px;background:linear-gradient(transparent,#89745d77 15%,#89745d55 85%,transparent);pointer-events:none}
    .brand{display:flex;gap:10px;align-items:center;padding:0 6px;height:52px}
    .command-emblem{position:relative;display:grid;place-items:center;flex:none;width:33px;height:45px;color:var(--gold);border:1px solid #a28a5e;clip-path:polygon(0 0,100% 0,100% 86%,50% 100%,0 86%);background:linear-gradient(130deg,#4d3f2c,#241e17);font-size:24px}
    .command-emblem::before{content:"";position:absolute;inset:3px 3px 7px;border:1px solid #a28a5e66}
    .brand-name{margin:0;font-size:19px;letter-spacing:1px;line-height:1.5;white-space:nowrap}
    .brand-sub{margin:1px 0 0;font-size:9px;color:#aa9c85;letter-spacing:2px}
    .roster-title{display:flex;align-items:center;justify-content:space-between;margin:26px 6px 9px;padding-bottom:12px;border-bottom:1px solid #75665466}
    .roster-title h2{margin:0;font-size:15px;font-weight:500;letter-spacing:2px}
    .roster-title span{font-size:10px;color:var(--quiet)}
    .hero-list{display:flex;flex-direction:column;gap:5px}
    .hero{position:relative;display:flex;align-items:center;gap:9px;min-height:80px;width:176px;padding:9px 7px;text-align:left;background:transparent;border:1px solid transparent;transition:background .15s,border-color .15s}
    .hero:not(:last-child)::after{content:"";position:absolute;bottom:-3px;left:67px;right:9px;height:1px;background:#75665444}
    .hero:hover{background:#66534022}
    .portrait-frame{position:relative;display:block;width:50px;height:59px;flex:none;overflow:hidden;background:radial-gradient(ellipse at 50% 65%,#7d6d4b55,#211c1800 80%);border-bottom:1px solid #75665488}
    .portrait-frame img{width:100%;height:100%;object-fit:cover;object-position:center 25%;filter:saturate(.8);transition:filter .2s}
    .hero-copy{display:flex;flex:1;flex-direction:column;gap:5px;min-width:0}
    .hero-line{display:flex;align-items:center;justify-content:space-between;gap:4px}
    .hero-name{font-size:19px;letter-spacing:3px;line-height:1.1}
    .hero-role{font-size:10px;color:var(--quiet);letter-spacing:1px}
    .hero-cost{display:flex;align-items:center;gap:3px;font-size:12px;color:#c6b899}
    .hero-cost svg{width:11px;height:11px}
    .hero-state{font-size:10px;letter-spacing:.5px;color:#9a907f;white-space:nowrap}
    .hero.is-deployed .hero-state{color:#a4b59a}
    .hero.is-deployed .hero-state::before{content:"";display:inline-block;width:4px;height:4px;background:#9bad90;margin:0 4px 2px 0}
    .hero.is-selected{background:linear-gradient(90deg,#67513566,#61503922);border-color:#ab8a5366}
    .hero.is-selected::before{content:"";position:absolute;left:-1px;top:15px;bottom:15px;width:3px;background:var(--gold)}
    .hero.is-selected .hero-name,.hero.is-selected .hero-state{color:#e6cd96}
    .hero.is-selected .portrait-frame img{filter:saturate(1)}
    .hero.is-unaffordable .hero-state,.hero.is-unaffordable .hero-cost{color:#dc9a86}
    .hero.is-unaffordable .portrait-frame img{filter:saturate(.35)}
    .roster-bottom{position:absolute;left:18px;right:18px;bottom:27px;padding-top:20px;border-top:1px solid #75665455}
    .roster-caption{margin:0 0 18px;font-size:11px;line-height:1.9;color:#aa9d86}
    .rules-button{display:flex;align-items:center;gap:8px;padding:5px 0;background:none;border:0;color:#c6baa4;font-size:12px}
    .rules-button svg{width:16px;height:16px}
    .rules-button::after{content:"›";margin-left:auto;color:var(--bronze);font-size:19px}
    .topbar{position:absolute;top:0;left:200px;right:0;height:94px;display:flex;align-items:center;padding:0 24px 0 25px;z-index:5}
    .stage-heading{min-width:310px;align-self:center}
    .stage-kicker{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#a5967c;font-size:10px;letter-spacing:2px}
    .stage-kicker::before{content:"";display:block;width:16px;height:1px;background:#94764e}
    .stage-title{margin:0;font-size:29px;line-height:1;letter-spacing:5px}
    .stage-state{display:inline-flex;align-items:center;gap:6px;margin-left:13px;padding:4px 8px;vertical-align:4px;border:1px solid #75665477;color:#c7b99e;font-size:10px;letter-spacing:1px;font-family:"Microsoft YaHei",sans-serif}
    .stage-state::before{content:"";width:4px;height:4px;background:#bca16c;border-radius:50%}
    .telemetry{display:flex;align-items:center;gap:25px;margin-left:auto;margin-right:24px}
    .stat{position:relative;min-width:66px}
    .stat-label{display:flex;gap:5px;align-items:center;color:#a99b84;font-size:10px;margin-bottom:8px;letter-spacing:1px}
    .stat-label svg{width:13px;height:13px}
    .stat-value{font-size:24px;letter-spacing:1px;line-height:1;color:#ede1c9}
    .stat-value.gold{color:#e0c68e}
    .stat-value.small{font-size:20px}
    .speed-button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:48px;height:53px;padding:0 5px;border:0;border-left:1px solid #75665466;background:none;color:#c9b99d;font-size:12px;line-height:1.5}
    .speed-button svg{width:17px;height:17px}
    .order-button{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:153px;height:56px;background:linear-gradient(135deg,#a34536,#853128 80%);border:1px solid #bd7660;box-shadow:inset 0 0 0 3px #421f1944,0 4px 9px #0003;color:#f5e7ce;font-family:MilitarySong,SimSun,serif;font-size:21px;letter-spacing:2px;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
    .order-button:hover{background:linear-gradient(135deg,#b5513e,#91382c)}
    .order-button:focus-visible{outline:none;box-shadow:inset 0 0 0 4px #f0d690}
    .order-button::after{content:"";position:absolute;inset:5px;border:1px solid #e4b78844;pointer-events:none}
    .order-button svg{width:17px;height:17px;fill:currentColor;stroke-width:0}
    .field-labels{position:absolute;left:224px;right:26px;top:94px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#b6a891;letter-spacing:1px;z-index:6}
    .field-labels .label-left{display:flex;align-items:center;gap:9px}
    .field-labels .label-left svg{width:13px;height:13px;color:#c1a06a}
    .field-legend{display:flex;align-items:center;gap:16px;color:#a89b83}
    .field-legend span{display:flex;align-items:center;gap:5px}
    .legend-mark{width:6px;height:6px;display:inline-block;transform:rotate(45deg);border:1px solid #aa956a}
    .legend-mark.deployed{background:#77987c;border-color:#77987c}
    .battlefield{position:absolute;left:210px;top:115px;width:1056px;height:400px;overflow:hidden;background:#c8c9a1;border:1px solid #a38c5b99;box-shadow:0 8px 18px #0002;z-index:3}
    .battlefield::after{content:"";position:absolute;inset:4px;border:1px solid #f7e5be44;pointer-events:none;z-index:7}
    .battlefield .scene-map{filter:saturate(.82);opacity:1}
    .battlefield .scene-slot{border-color:#e8d7ad;background:#4d5f4a66;color:#fff0cb;box-shadow:0 1px 3px #28332888,inset 0 0 0 2px #374c3222}
    .battlefield .scene-slot:hover,.battlefield .scene-slot:focus-visible{border-color:#fff0bb;background:#9f823a99;box-shadow:0 0 0 3px #f2d89d77}
    .battlefield .scene-slot.is-candidate{border-color:#ffe6a2;background:#9f823a99;box-shadow:0 0 0 3px #ffe4a166}
    .battlefield .scene-label{color:#fff2d5;background:#342c21e0;border:1px solid #b79b6d88;box-shadow:0 2px 4px #0003;font-family:"Microsoft YaHei",sans-serif;font-weight:500}
    .battlefield .scene-label span{color:#c5b087}
    .battlefield .scene-coverage{border-color:#b99244aa;background:#e5cb6416}
    .field-guidance{position:absolute;left:224px;right:26px;top:525px;display:flex;align-items:center;justify-content:space-between;gap:20px;z-index:6}
    .guidance-text{display:flex;align-items:center;gap:8px;color:#d3c3a6;font-size:12px;letter-spacing:.5px}
    .guidance-text::before{content:"令";display:grid;place-items:center;width:18px;height:18px;color:#e8b7a1;background:#6b2d25;border:1px solid #a1644d;font-family:MilitarySong,SimSun,serif;font-size:11px}
    .deselect-button{padding:3px 0 3px 10px;min-width:75px;background:none;border:0;color:#a99a82;font-size:11px;text-align:right;text-decoration:underline;text-decoration-color:#756654;text-underline-offset:4px}
    .growth-ribbon{position:absolute;left:222px;right:26px;top:565px;height:120px;display:flex;border-top:1px solid #75665488;z-index:6}
    .growth-ribbon::before{content:"";position:absolute;left:0;right:0;top:3px;height:1px;background:#75665433}
    .selected-general{position:relative;display:flex;align-items:center;width:350px;flex:none;padding-left:120px;padding-top:8px}
    .selected-figure{position:absolute;left:-2px;bottom:-1px;width:117px;height:143px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 7px 6px #0005)}
    .focus-kicker{font-size:9px;color:#9f8d70;letter-spacing:2px;margin-bottom:8px}
    .focus-name{font-size:27px;letter-spacing:5px;line-height:1;margin:0 0 9px}
    .focus-role{display:flex;align-items:center;gap:8px;font-size:11px;color:#bdad90}
    .focus-role::after{content:"";width:20px;height:1px;background:#756654}
    .cost-note{display:flex;align-items:center;gap:7px;margin-top:9px;color:#aa9a7c;font-size:10px}
    .cost-note strong{font-size:15px;color:#d4bd88;font-weight:400}
    .growth-divider{width:1px;height:67px;margin:30px 27px 0 0;background:linear-gradient(transparent,#75665499,transparent);flex:none}
    .upgrade-content{flex:1;padding:23px 24px 0 0;min-width:0}
    .upgrade-heading{display:flex;align-items:center;gap:9px;color:#a8987e;font-size:10px;letter-spacing:2px}
    .upgrade-heading svg{width:14px;height:14px;color:#9f8960}
    .upgrade-title{display:block;margin-top:8px;font-size:17px;font-weight:500;letter-spacing:1px;color:#deceb1}
    .upgrade-note{margin:7px 0 0;max-width:360px;font-size:11px;line-height:1.7;color:#ab9b7f}
    .upgrade-action{width:174px;flex:none;padding-top:30px}
    .upgrade-button{display:flex;gap:9px;align-items:center;justify-content:center;width:174px;height:42px;border:1px solid #9d8457;background:linear-gradient(120deg,#65523533,#8e714533);box-shadow:inset 0 0 0 3px #a78d5710;color:#dbc18b;font-size:14px;letter-spacing:1px}
    .upgrade-button:hover{background:#8e714544;border-color:#c7ab70}
    .upgrade-button:disabled{color:#8f8169;border-color:#675c48;background:#75665411;box-shadow:none}
    .upgrade-button svg{width:16px;height:16px}
    .upgrade-action p{margin:8px 0 0;color:#8f816a;font-size:10px;text-align:center;letter-spacing:.5px}
    .proposal-footer{position:absolute;left:222px;right:26px;bottom:9px;height:17px;display:flex;align-items:center;justify-content:space-between;color:#857963;font-size:9px;letter-spacing:1px;z-index:10}
    .proposal-footer p{margin:0}
    .proposal-modal{background:#1d1712a8}
    .proposal-dialog{background:linear-gradient(130deg,#302821,#211c18);color:var(--ivory);border:1px solid #9d8457;border-radius:2px;box-shadow:inset 0 0 0 5px #c7ab7010,0 24px 70px #0006}
    .proposal-dialog h2{font-family:MilitarySong,SimSun,serif;font-weight:400;letter-spacing:3px;color:#e9d7b5}
    .proposal-dialog p{color:#cbbda4}
    .proposal-dialog small{color:#9f927a}
    .proposal-dialog button{background:var(--vermilion);border:1px solid #b9725b;border-radius:2px;color:#f5e7ce}
    .proposal-summary{border-color:#75665488}
    .proposal-summary strong{color:#ddc28b}
    .proposal-summary span{color:#ab9b7f}
    body[data-phase="running"] .stage-state::before{background:#a3b58a;box-shadow:0 0 5px #a3b58a66}
    body[data-phase="paused"] .stage-state::before{background:#cfad67}
    body[data-wallet="low"] .stat-value.gold{color:#e5a18d}
    body[data-wallet="low"] .stat-wallet .stat-label{color:#c9917c}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body data-phase="preparing" data-wallet="normal">
  <svg aria-hidden="true" width="0" height="0" style="position:absolute;overflow:hidden">
    <symbol id="coin" viewBox="0 0 24 24"><path d="M12 2 20.7 7v10L12 22 3.3 17V7Z"/><path d="M9 9h6v6H9Z"/></symbol>
    <symbol id="flag" viewBox="0 0 24 24"><path d="M5 22V3m1 1h13l-4 5 4 5H6"/></symbol>
    <symbol id="rules" viewBox="0 0 24 24"><path d="M5 3h14v18H5zM9 7h6M9 11h6M9 15h4"/></symbol>
    <symbol id="speed" viewBox="0 0 24 24"><path d="m4 6 7 6-7 6m9-12 7 6-7 6"/></symbol>
    <symbol id="upgrade" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v15M5 20h14"/></symbol>
    <symbol id="terrain" viewBox="0 0 24 24"><path d="m2 18 6-10 5 6 3-4 6 8H2ZM8 8l2-3 3 4"/></symbol>
  </svg>
  <main id="artboard" aria-label="B方案：漆金军令，黄巾演武布阵界面">
    <aside class="roster" aria-label="武将名册">
      <div class="brand">
        <div class="command-emblem display" aria-hidden="true">令</div>
        <div><h1 class="brand-name display">军师请下令</h1><p class="brand-sub">三国名将 · 布阵守城</p></div>
      </div>
      <div class="roster-title"><h2 class="display">出战名册</h2><span>本关五将</span></div>
      <div class="hero-list">
        <button type="button" class="hero is-deployed" data-hero="guan_yu">
          <span class="portrait-frame"><img src="assets/portraits/guan_yu.png" alt="关羽"></span>
          <span class="hero-copy"><span class="hero-line"><span class="hero-name display">关羽</span><span class="hero-cost utility"><svg aria-hidden="true"><use href="#coin"/></svg>130</span></span><span class="hero-role">定点破阵</span><span class="hero-state" data-card-status>已上阵</span></span>
        </button>
        <button type="button" class="hero is-deployed" data-hero="huang_zhong">
          <span class="portrait-frame"><img src="assets/portraits/huang_zhong.png" alt="黄忠"></span>
          <span class="hero-copy"><span class="hero-line"><span class="hero-name display">黄忠</span><span class="hero-cost utility"><svg aria-hidden="true"><use href="#coin"/></svg>110</span></span><span class="hero-role">定点破阵</span><span class="hero-state" data-card-status>已上阵</span></span>
        </button>
        <button type="button" class="hero is-selected" data-hero="zhao_yun">
          <span class="portrait-frame"><img src="assets/portraits/zhao_yun.png" alt="赵云"></span>
          <span class="hero-copy"><span class="hero-line"><span class="hero-name display">赵云</span><span class="hero-cost utility"><svg aria-hidden="true"><use href="#coin"/></svg>120</span></span><span class="hero-role">群体清场</span><span class="hero-state" data-card-status>待下令</span></span>
        </button>
        <button type="button" class="hero" data-hero="zhou_yu">
          <span class="portrait-frame"><img src="assets/portraits/zhou_yu.png" alt="周瑜"></span>
          <span class="hero-copy"><span class="hero-line"><span class="hero-name display">周瑜</span><span class="hero-cost utility"><svg aria-hidden="true"><use href="#coin"/></svg>135</span></span><span class="hero-role">群体清场</span><span class="hero-state" data-card-status>可招募</span></span>
        </button>
        <button type="button" class="hero" data-hero="lu_xun">
          <span class="portrait-frame"><img src="assets/portraits/lu_xun.png" alt="陆逊"></span>
          <span class="hero-copy"><span class="hero-line"><span class="hero-name display">陆逊</span><span class="hero-cost utility"><svg aria-hidden="true"><use href="#coin"/></svg>115</span></span><span class="hero-role">群体清场</span><span class="hero-state" data-card-status>可招募</span></span>
        </button>
      </div>
      <div class="roster-bottom"><p class="roster-caption">先选武将，再点空阵位。<br>每将每局仅可招募一次。</p><button type="button" class="rules-button" data-action="rules"><svg aria-hidden="true"><use href="#rules"/></svg>布阵规则</button></div>
    </aside>

    <header class="topbar">
      <div class="stage-heading"><div class="stage-kicker">第一关 · 守住城门</div><h2 class="stage-title display">黄巾演武<span class="stage-state"><span data-readout="state">备战</span></span></h2></div>
      <div class="telemetry" aria-label="城防、战况与军饷">
        <div class="stat stat-defense"><div class="stat-label">城防</div><div class="stat-value small utility" aria-label="城防30，总城防30">30/30</div></div>
        <div class="stat stat-wallet"><div class="stat-label"><svg aria-hidden="true"><use href="#coin"/></svg>军饷</div><div class="stat-value gold utility" data-readout="gold">240</div></div>
        <div class="stat"><div class="stat-label">敌军波次</div><div class="stat-value small utility" data-readout="wave">0 / 5</div></div>
        <div class="stat"><div class="stat-label">守关用时</div><div class="stat-value small utility" data-readout="time">00:00</div></div>
      </div>
      <button type="button" class="speed-button utility" data-action="speed" aria-label="切换战斗倍速"><svg aria-hidden="true"><use href="#speed"/></svg><span>1×</span></button>
      <button type="button" class="order-button" data-action="toggle-run">开始守关</button>
    </header>

    <div class="field-labels"><span class="label-left"><svg aria-hidden="true"><use href="#terrain"/></svg>守城军图</span><div class="field-legend" aria-label="阵位图例"><span><i class="legend-mark"></i>空阵位</span><span><i class="legend-mark deployed"></i>已上阵</span></div></div>
    <section class="battlefield" data-scene aria-label="黄巾演武战场，32个可交互阵位"></section>
    <div class="field-guidance"><div class="guidance-text" role="status" aria-live="polite" data-readout="hint">已选赵云，点击空阵位下令招募。</div><button type="button" class="deselect-button" data-action="deselect">取消选将</button></div>

    <section class="growth-ribbon" aria-label="当前武将与成长">
      <div class="selected-general">
        <img class="selected-figure" src="assets/characters/zhao_yun.png" data-selected-character alt="当前选中武将立绘">
        <div><div class="focus-kicker">当前武将</div><h3 class="focus-name display" data-readout="selected-name">赵云</h3><div class="focus-role" data-readout="selected-role">群体清场</div><div class="cost-note">招募军饷 <strong class="utility" data-readout="selected-cost">120</strong></div></div>
      </div>
      <div class="growth-divider" aria-hidden="true"></div>
      <div class="upgrade-content"><div class="upgrade-heading"><svg aria-hidden="true"><use href="#flag"/></svg>阵前成长</div><strong class="upgrade-title" data-readout="upgrade-title">上阵后可强化</strong><p class="upgrade-note" data-readout="upgrade-note">查看已上阵的武将，为守城主力提升战力。</p></div>
      <div class="upgrade-action"><button type="button" class="upgrade-button" data-action="upgrade"><svg aria-hidden="true"><use href="#upgrade"/></svg>强化武将</button><p>备战可免费调整阵位</p></div>
    </section>

    <footer class="proposal-footer"><p>界面提案 · 沿用正式素材</p></footer>
  </main>
  <script src="preview.js"></script>
</body>
</html>
