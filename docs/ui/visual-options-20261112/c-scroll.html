<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>军师请下令 · C 丹青游记</title>
  <link rel="stylesheet" href="preview.css">
  <style>
    :root{--paper:#f2f4ea;--page:#fcfdf6;--lake:#397b8c;--bamboo:#4d725d;--red:#b74637;--ink:#263e42;--muted:#647775;--rule:rgba(57,123,140,.2)}
    *{box-sizing:border-box}
    body{margin:0;background:#d6ded9;color:var(--ink);font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif}
    button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible{outline:3px solid var(--red);outline-offset:4px}
    button:disabled{cursor:default}
    #artboard{position:absolute;width:1280px;height:720px;overflow:hidden;background:var(--paper);isolation:isolate;box-shadow:0 14px 80px #263e4230}
    #artboard::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.35;background-image:repeating-linear-gradient(0deg,transparent 0 3px,#397b8c05 3px 4px),repeating-linear-gradient(90deg,transparent 0 5px,#4d725d05 5px 6px)}
    .title-block{position:absolute;left:35px;top:20px;display:flex;gap:17px;align-items:center;height:59px}
    .title-mark{position:relative;display:grid;place-items:center;align-self:stretch;width:36px;border:1px solid var(--lake);color:var(--lake);font-family:"SimSun",GameChinese,serif;font-size:13px;line-height:1.1;letter-spacing:3px;writing-mode:vertical-rl;padding-top:2px}
    .title-mark::after{content:"";position:absolute;inset:3px;border:1px solid #397b8c40;pointer-events:none}
    .game-name{font-size:10px;letter-spacing:3px;margin:0 0 5px;color:var(--muted)}
    h1{font-family:"SimSun",GameChinese,serif;font-size:31px;font-weight:400;letter-spacing:4px;line-height:1.1;margin:0}
    .chapter{position:absolute;left:304px;top:49px;font-family:"SimSun",GameChinese,serif;font-size:13px;letter-spacing:1px;color:var(--muted)}
    .chapter::before{content:"";display:inline-block;width:25px;height:1px;background:var(--lake);vertical-align:middle;margin-right:12px;opacity:.45}
    .battle-notes{position:absolute;left:624px;top:23px;display:flex;gap:27px;align-items:flex-start}
    .note{position:relative;min-width:72px;padding-left:12px;border-left:1px solid var(--rule)}
    .note small{display:block;font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:4px}
    .note strong{display:block;font-size:23px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:.5px}
    .note .unit{font-size:13px;letter-spacing:0;font-weight:400}
    .gold-note{min-width:95px}
    .gold-note strong{color:var(--bamboo)}
    .gold-note small::before{content:"";display:inline-block;width:10px;height:10px;border:1px solid var(--bamboo);border-radius:50%;margin-right:6px;vertical-align:-1px;background:linear-gradient(90deg,transparent 40%,#4d725d50 40% 60%,transparent 60%)}
    .page-controls{position:absolute;right:29px;top:26px;display:flex;align-items:center;gap:8px}
    .page-control{height:43px;min-width:50px;border:1px solid var(--rule);background:#fcfdf691;border-radius:3px;font-size:16px;letter-spacing:.5px;padding:0 13px;transition:background .15s,border-color .15s}
    .page-control:hover{border-color:var(--lake);background:var(--page)}
    .speed{font-size:18px;font-variant-numeric:tabular-nums;min-width:55px;padding:0 8px}
    .scene-paper{position:absolute;left:30px;top:94px;width:1220px;height:462px;overflow:hidden;background:#dde7cf;box-shadow:0 1px 0 #397b8c35,0 -1px 0 #397b8c20}
    .scene-paper::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;box-shadow:inset 0 0 0 1px #397b8c20}
    .scene-map{width:100%;height:100%;object-fit:fill}
    .scene-slot{border:1px solid #4d725d60;background:#8bab7312;color:#4d725d;box-shadow:none;transition:background .15s,border-color .15s,box-shadow .15s}
    .scene-slot:hover,.scene-slot:focus-visible{border-color:var(--lake);background:#79a89430;box-shadow:0 0 0 3px #397b8c18}
    .scene-slot.is-occupied,.scene-slot.occupied{border-color:var(--bamboo);background:#4d725d35;color:var(--bamboo)}
    .scene-slot.is-candidate{border:2px solid var(--lake);background:#9acac43d;box-shadow:0 0 0 4px #397b8c24}
    .scene-slot.is-selected{border-color:var(--red);box-shadow:0 0 0 4px #b7463730}
    .scene-label{color:var(--ink);font-size:14px;white-space:nowrap;background:#fcfdf6ed;border:1px solid #397b8c45;border-radius:2px;padding:2px 6px;box-shadow:0 2px 5px #263e421c}
    .scene-coverage{background:#397b8c14;border:1px dashed #397b8c99}
    .scene-entry{background:#397b8ce6;color:var(--page);border-radius:2px;font-size:12px}
    .page-corner{position:absolute;z-index:6;left:44px;top:105px;display:flex;gap:7px;align-items:center;pointer-events:none;color:var(--lake);font-family:"SimSun",GameChinese,serif;font-size:11px;letter-spacing:1px}
    .page-corner svg{width:22px;height:22px;overflow:visible}
    .phase-note{position:absolute;right:45px;top:107px;z-index:6;display:flex;align-items:center;gap:6px;background:#fcfdf6ed;border:1px solid #397b8c40;border-radius:2px;padding:5px 9px;font-size:14px;color:var(--lake)}
    .phase-dot{width:5px;height:5px;background:var(--lake);border-radius:50%}
    .phase-time{padding-left:9px;margin-left:4px;border-left:1px solid var(--rule);font-variant-numeric:tabular-nums;color:var(--muted)}
    .selection-line{position:absolute;left:35px;top:560px;width:1208px;height:28px;display:flex;align-items:center;gap:8px;font-size:16px;white-space:nowrap}
    .selection-label{color:var(--muted);font-size:12px;letter-spacing:1px;padding-right:5px}
    .selected-name{font-family:"SimSun",GameChinese,serif;font-size:16px;min-width:32px}
    .selected-role{font-size:12px;color:var(--muted)}
    .selection-separator{height:12px;width:1px;background:var(--rule);margin:0 4px}
    .map-hint{margin-left:12px;color:var(--lake);overflow:hidden;text-overflow:ellipsis;flex:1;font-size:14px}
    .clear-selection{border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--muted);height:26px;padding:0 3px;font-size:14px;white-space:nowrap}
    .clear-selection:hover{color:var(--red);border-color:var(--red)}
    .upgrade{border:1px solid #397b8c48;border-radius:2px;background:#fcfdf699;padding:3px 10px;color:var(--lake);font-size:14px;height:26px;min-width:145px;margin-left:10px;white-space:nowrap}
    .upgrade:hover{background:var(--page);border-color:var(--lake)}
    .upgrade:disabled{color:var(--muted);opacity:.7}
    .hero-book{position:absolute;left:23px;top:590px;width:1066px;height:107px;background:var(--page);border:1px solid #397b8c26;box-shadow:0 4px 0 -1px var(--paper),0 5px 0 -1px #397b8c35,0 8px 0 -2px var(--page),0 9px 0 -2px #397b8c30,0 8px 15px #263e4210;display:flex;padding:0 10px 0 36px;gap:0;border-radius:2px}
    .book-spine{position:absolute;left:9px;top:15px;bottom:15px;writing-mode:vertical-rl;font-family:"SimSun",GameChinese,serif;font-size:13px;letter-spacing:4px;color:var(--lake)}
    .hero-card{position:relative;width:204px;flex:1;min-width:0;height:105px;background:transparent;border:0;border-left:1px solid #397b8c22;text-align:left;padding:11px 7px 10px 77px;isolation:isolate;transition:background .15s}
    .hero-card:first-of-type{border-left:0}
    .hero-card::after{content:"";position:absolute;inset:5px 4px;border:1px solid transparent;pointer-events:none}
    .hero-card:hover{background:#397b8c0b}
    .hero-card img{position:absolute;left:3px;bottom:0;width:77px;height:101px;object-fit:contain;object-position:bottom;z-index:-1;pointer-events:none;filter:drop-shadow(0 1px 1px #263e4215)}
    .hero-name{display:block;font-family:"SimSun",GameChinese,serif;font-size:21px;line-height:1.2;font-weight:400;letter-spacing:2px;white-space:nowrap}
    .hero-role{display:block;color:var(--muted);font-size:12px;margin-top:3px;letter-spacing:.5px;white-space:nowrap}
    .hero-price{display:block;font-size:16px;font-variant-numeric:tabular-nums;margin-top:8px;color:var(--ink);white-space:nowrap}
    .hero-price::before{content:"";display:inline-block;border:1px solid currentColor;border-radius:50%;width:8px;height:8px;margin-right:5px;opacity:.7}
    .hero-status{position:absolute;right:7px;bottom:10px;display:block;font-size:12px;color:var(--lake);line-height:19px;padding:0 4px;white-space:nowrap}
    .hero-card.is-selected{background:#397b8c12}
    .hero-card.is-selected::after{border-color:var(--lake)}
    .hero-card.is-selected::before{content:"";position:absolute;top:-5px;left:78px;width:17px;height:8px;background:var(--lake);clip-path:polygon(0 0,100% 0,100% 100%,50% 65%,0 100%)}
    .hero-card.is-selected .hero-status{color:var(--page);background:var(--lake)}
    .hero-card.is-deployed .hero-status{color:var(--bamboo);border:1px solid #4d725d70;background:#4d725d09}
    .hero-card.is-deployed .hero-status::before{content:"✓";padding-right:3px}
    .hero-card.is-deployed.is-selected .hero-status{background:var(--bamboo);color:var(--page)}
    .hero-card.is-unaffordable .hero-status,.hero-card.is-unaffordable .hero-price{color:var(--red)}
    .hero-card.is-unaffordable img{filter:saturate(.65);opacity:.8}
    .hero-card.is-unaffordable.is-selected .hero-status{color:var(--page);background:var(--red)}
    .command-area{position:absolute;right:30px;top:590px;width:125px;height:107px;display:flex;align-items:center;justify-content:center}
    .command-area::before{content:"";position:absolute;left:-19px;top:15px;bottom:15px;width:1px;background:var(--rule)}
    .command-seal{position:relative;width:105px;height:105px;background:var(--red);border:1px solid var(--red);border-radius:50%;color:var(--page);font-family:"SimSun",GameChinese,serif;font-size:24px;font-weight:400;line-height:1.2;letter-spacing:2px;padding:17px 23px 18px 25px;box-shadow:1px 2px 0 #b7463720;transition:transform .15s,background .15s;word-break:break-all}
    .command-seal::before{content:"";position:absolute;inset:5px;border:1px solid #fcfdf6b5;border-radius:50%;pointer-events:none}
    .command-seal::after{content:"";position:absolute;inset:9px;border:1px solid #fcfdf63b;border-radius:50%;pointer-events:none}
    .command-seal:hover{background:#a63a2d;transform:translateY(-2px)}
    .command-seal:active{transform:translateY(0)}
    .proposal-note{position:absolute;left:30px;bottom:4px;right:30px;display:flex;align-items:center;justify-content:space-between;font-size:9px;line-height:13px;color:var(--muted);letter-spacing:1px;pointer-events:none}
    .proposal-note em{font-style:normal;color:var(--lake);margin-right:11px}
    body[data-phase="running"] .phase-dot{background:var(--bamboo);box-shadow:0 0 0 3px #4d725d15}
    body[data-phase="running"] .phase-note{color:var(--bamboo)}
    body[data-phase="paused"] .phase-note{color:var(--red);border-color:#b7463760}
    body[data-phase="paused"] .phase-dot{background:var(--red);border-radius:0;width:6px}
    body[data-phase="paused"] .command-seal{background:var(--lake);border-color:var(--lake)}
    body[data-wallet="low"] .gold-note strong{color:var(--red)}
    body[data-wallet="low"] .map-hint{color:var(--red)}
    .proposal-modal{background:#263e428a;backdrop-filter:blur(3px)}
    .proposal-dialog{background:var(--page);border:1px solid #397b8c65;border-radius:3px;color:var(--ink);box-shadow:0 5px 0 -2px var(--paper),0 6px 0 -2px #397b8c60,0 20px 70px #263e4250}
    .proposal-dialog h2{font-family:"SimSun",GameChinese,serif;font-weight:400;color:var(--ink);letter-spacing:2px}
    .proposal-dialog p{color:var(--ink);font-size:15px}
    .proposal-dialog small,.proposal-summary span{color:var(--muted)}
    .proposal-dialog button{background:var(--lake);color:var(--page);border-radius:2px}
    .proposal-summary{border-color:var(--rule)}
    .proposal-summary strong{color:var(--bamboo)}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body data-phase="preparing" data-wallet="normal">
  <main id="artboard" aria-label="军师请下令，丹青游记界面提案">
    <header>
      <div class="title-block">
        <div class="title-mark" aria-hidden="true">山河军图</div>
        <div><p class="game-name">军师请下令</p><h1>黄巾演武</h1></div>
      </div>
      <div class="chapter">三国名将 · 布阵守城</div>
      <div class="battle-notes" aria-label="守关情报">
        <div class="note"><small>波次</small><strong data-readout="wave">0 / 8</strong></div>
        <div class="note"><small>城防</small><strong>30<span class="unit"> / 30</span></strong></div>
        <div class="note gold-note"><small>军饷</small><strong data-readout="gold">240</strong></div>
      </div>
      <nav class="page-controls" aria-label="战斗控制">
        <button class="page-control speed" data-action="speed" aria-label="切换战斗速度">1×</button>
        <button class="page-control" data-action="rules" aria-label="查看布阵规则">规则</button>
      </nav>
    </header>

    <section class="scene-paper" data-scene aria-label="黄巾演武战场，32个真实阵位"></section>
    <div class="page-corner" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2v20M2 12h20M12 3l3 8-3-2-3 2 3-8Z" stroke="currentColor" stroke-width=".9"/><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width=".7" opacity=".6"/></svg>
      <span>北</span>
    </div>
    <div class="phase-note" aria-live="polite"><i class="phase-dot" aria-hidden="true"></i><span data-readout="state">整军备战</span><span class="phase-time" data-readout="time">00:00</span></div>

    <section class="selection-line" aria-label="当前选将与布阵说明">
      <span class="selection-label">当前</span><strong class="selected-name" data-readout="selected-name">赵云</strong>
      <span class="selected-role" data-readout="selected-role">群体清场</span>
      <span class="selection-separator" aria-hidden="true"></span><span class="selected-role">招募</span><span data-readout="selected-cost">120</span>
      <button class="clear-selection" data-action="deselect">取消选择</button>
      <span class="map-hint" data-readout="hint" aria-live="polite">已选赵云，点空阵位招募；点击已上阵武将可查看与升级。</span>
      <button class="upgrade" data-action="upgrade"><span data-readout="upgrade-title">上阵后可升级</span></button>
    </section>

    <section class="hero-book" aria-label="本关武将册">
      <span class="book-spine" aria-hidden="true">武将册</span>
      <button class="hero-card is-deployed" data-hero="guan_yu">
        <img src="assets/portraits/guan_yu.png" alt=""><strong class="hero-name">关羽</strong><span class="hero-role">定点破阵</span><span class="hero-price">130</span><span class="hero-status" data-card-status>已上阵</span>
      </button>
      <button class="hero-card is-deployed" data-hero="huang_zhong">
        <img src="assets/portraits/huang_zhong.png" alt=""><strong class="hero-name">黄忠</strong><span class="hero-role">定点破阵</span><span class="hero-price">110</span><span class="hero-status" data-card-status>已上阵</span>
      </button>
      <button class="hero-card is-selected" data-hero="zhao_yun">
        <img src="assets/portraits/zhao_yun.png" alt=""><strong class="hero-name">赵云</strong><span class="hero-role">群体清场</span><span class="hero-price">120</span><span class="hero-status" data-card-status>点阵位</span>
      </button>
      <button class="hero-card" data-hero="zhou_yu">
        <img src="assets/portraits/zhou_yu.png" alt=""><strong class="hero-name">周瑜</strong><span class="hero-role">群体清场</span><span class="hero-price">135</span><span class="hero-status" data-card-status>可招募</span>
      </button>
      <button class="hero-card" data-hero="lu_xun">
        <img src="assets/portraits/lu_xun.png" alt=""><strong class="hero-name">陆逊</strong><span class="hero-role">群体清场</span><span class="hero-price">115</span><span class="hero-status" data-card-status>可招募</span>
      </button>
    </section>
    <div class="command-area"><button class="command-seal" data-action="toggle-run">开始守关</button></div>
    <footer class="proposal-note"><span><em>C · 丹青游记</em>界面提案 · 沿用正式素材</span><span>军师一声令，名将守山河。</span></footer>
  </main>
  <script src="preview.js" defer></script>
</body>
</html>
